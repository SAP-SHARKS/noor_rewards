# Codemagic build configuration.
#
# Signing identity is fetched at build time from the App Store Connect API
# key uploaded under Teams → Codemagic → Integrations → Developer Portal.
# The Sabiq integration uses its own key (separate from Islam Focus) so
# each app can be signed against its own Apple team without conflicts.
#   Integration name : Amna
# `xcode-project use-profiles` then provisions / fetches a matching
# development profile for com.sabiq.rewards before flutter build ipa.

workflows:
  ios-workflow:
    name: iOS App Store Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Amna
    environment:
      ios_signing:
        # Switch to ad_hoc for UDID-restricted test builds, or development
        # for direct-install dev builds.
        distribution_type: app_store
        bundle_identifier: com.sabiq.rewards
      vars:
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generate .env from Codemagic environment variables
        # `.env` is gitignored (it holds Quran Foundation API secrets) but
        # pubspec.yaml declares it as a Flutter asset, so the asset bundler
        # needs a file. We write one from Codemagic env vars — set them
        # under Workflow → Environment variables (mark each "Secure").
        # If a var is unset the placeholder stays empty and the Quran
        # auth code falls back to unauthenticated mode automatically.
        script: |
          cat > "$CM_BUILD_DIR/.env" <<EOF
          IS_DEV=${IS_DEV:-false}
          QURAN_PRELIVE_CLIENT_ID=${QURAN_PRELIVE_CLIENT_ID:-}
          QURAN_PRELIVE_CLIENT_SECRET=${QURAN_PRELIVE_CLIENT_SECRET:-}
          QURAN_PROD_CLIENT_ID=${QURAN_PROD_CLIENT_ID:-}
          QURAN_PROD_CLIENT_SECRET=${QURAN_PROD_CLIENT_SECRET:-}
          EOF
      - name: Disable Swift Package Manager (use CocoaPods)
        # Firebase iOS SDK 12.x has a known SPM bug where the grpc-binary
        # artifact zip fails to download on fresh CI runners
        # ("file not found: SourcePackages/artifacts/grpc-binary/grpc/grpc.zip").
        # Forcing CocoaPods sidesteps the SPM dependency graph entirely
        # and is the path Firebase officially supports for Flutter.
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Fetch the latest Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        # With SPM disabled, `flutter pub get` (above) auto-generates
        # ios/Podfile + ios/Flutter/Generated.xcconfig referencing every
        # plugin pod. We then run `pod install` in the ios/ folder so
        # Runner.xcworkspace links the resolved pods.
        script: |
          cd ios && pod install --repo-update
      - name: Set up code signing (fetch or create cert + profile)
        # On a fresh Apple team the auto-signing block in `integrations`
        # can silently no-op if no distribution cert exists yet. Doing
        # this explicitly guarantees a Distribution cert is present and
        # a matching App Store profile is fetched/created before
        # `use-profiles` configures Xcode with them.
        script: |
          set -x
          keychain initialize

          echo "=== Diagnostic: what can this API key see? ==="
          echo "--- Bundle IDs visible ---"
          app-store-connect bundle-ids list --json | jq '.[] | {id, identifier, name, platform}' || true
          echo "--- Distribution certificates visible ---"
          app-store-connect certificates list --type IOS_DISTRIBUTION --json | jq '.[] | {id, name, certificateType}' || true
          echo "=== End diagnostic ==="

          echo "=== Ensuring Distribution certificate exists ==="
          if [ -z "$(app-store-connect certificates list --type IOS_DISTRIBUTION --json | jq -r '.[0].id // empty')" ]; then
            echo "No Distribution cert found — creating one"
            app-store-connect certificates create --type IOS_DISTRIBUTION --save
          else
            echo "Distribution certificate already exists — fetching to keychain"
            app-store-connect certificates list --type IOS_DISTRIBUTION --save
          fi

          echo "=== Creating/fetching provisioning profile ==="
          CERT_ID=$(app-store-connect certificates list --type IOS_DISTRIBUTION --json | jq -r '.[0].id')
          BUNDLE_RESOURCE_ID=$(app-store-connect bundle-ids list --bundle-id-identifier "com.sabiq.rewards" --strict-match-identifier --json | jq -r '.[0].id')

          if [ -z "$BUNDLE_RESOURCE_ID" ] || [ "$BUNDLE_RESOURCE_ID" = "null" ]; then
            echo "ERROR: Bundle ID 'com.sabiq.rewards' not visible to this API key."
            echo "Check Apple Developer Portal → Identifiers — the App ID must exist in"
            echo "the same team the API key was issued from. Also check the API key's"
            echo "access level in App Store Connect → Users and Access → Integrations."
            exit 1
          fi

          echo "Cert ID:     $CERT_ID"
          echo "Bundle Res:  $BUNDLE_RESOURCE_ID"

          app-store-connect profiles create \
            --type IOS_APP_STORE \
            --certificate "$CERT_ID" \
            --bundle-id "$BUNDLE_RESOURCE_ID" \
            --name "Sabiq iOS App Store Distribution" \
            --save \
            || echo "profiles create failed (may already exist — will fetch below)"

          app-store-connect fetch-signing-files "com.sabiq.rewards" \
            --platform IOS \
            --type IOS_APP_STORE
          keychain add-certificates
          xcode-project use-profiles
      - name: Flutter build IPA (release) with auto-bumped build number
        # Auto-bumps CFBundleVersion to (latest on App Store Connect) + 1.
        # Avoids the "bundle version must be higher than previously
        # uploaded version" 409 error. We pass the result directly to
        # `flutter build ipa --build-number=N` instead of editing
        # pubspec.yaml on disk — that way local Android builds keep using
        # whatever +N is committed, and we never risk a stale sed.
        #
        # Marketing version (X.Y.Z) is still read from pubspec.yaml. Bump
        # it manually in pubspec.yaml when shipping a real new release.
        script: |
          set -euo pipefail
          BUNDLE_ID="com.sabiq.rewards"

          echo "→ Looking up App Store Connect App ID for $BUNDLE_ID"
          APP_ID=$(app-store-connect apps list \
            --bundle-id-identifier "$BUNDLE_ID" \
            --strict-match-identifier \
            --json | jq -r '.[0].id // empty')

          if [ -z "$APP_ID" ]; then
            echo "ERROR: No app found on App Store Connect for $BUNDLE_ID"
            exit 1
          fi
          echo "  App ID: $APP_ID"

          echo "→ Fetching latest build number from App Store Connect"
          LATEST=$(app-store-connect get-latest-build-number "$APP_ID")
          NEW=$((LATEST + 1))
          echo "  Latest uploaded build: $LATEST"
          echo "  This build:           $NEW"

          echo "→ Building IPA with --build-number=$NEW"
          flutter build ipa --release \
            --build-number=$NEW \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
