org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Kotlin daemon needs its own heap ceiling — the compiler was crashing at
# 8g on Windows with default codegen because it forked with no explicit
# ceiling and hit OS-level limits. 3g is more than enough for this project.
kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
android.useAndroidX=true
org.gradle.java.home=D:/Android STudio/jbr
# Disable Kotlin incremental compilation to avoid cross-drive path errors on Windows
# (Pub cache on C: vs project on D: causes IllegalArgumentException in RelocatableFileToPathConverter)
kotlin.incremental=false